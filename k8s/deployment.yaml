apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwatch-deployment
  labels:
    app: appwatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appwatch
  template:
    metadata:
      labels:
        app: appwatch
    spec:
      containers:
      - name: appwatch
        image: appwatch:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          
